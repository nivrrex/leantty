[package]
name = "leantty-render"
version.workspace = true
license.workspace = true
publish.workspace = true
description.workspace = true
edition.workspace = true
rust-version.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
pollster = "0.4"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "=30.0.2", default-features = false, features = ["vulkan", "wgsl"] }

# 阶段 4P：Windows 上启用 wgpu（Vulkan + DX12）。仅在 config renderer.backend="gpu" 时使用；
# backend="auto" 在 Windows 上仍直接走 CPU（见 app 的后端选择逻辑）。
[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.2", default-features = false, features = ["vulkan", "dx12", "wgsl"] }

[lib]
name = "render"

[dependencies]
leantty-vt = { path = "../vt" }
softbuffer.workspace = true
fontdb.workspace = true
fontdue.workspace = true
thiserror.workspace = true
crossfont = "0.9.0"
