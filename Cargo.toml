[workspace.package]
rust-version = "1.96"
edition = "2024"

[workspace]
members = [
    "crates/config",
    "crates/vt",
    "crates/pty",
    "crates/render",
    "crates/app",
]
exclude = ["vendor/libghostty-rs"]
resolver = "2"

[workspace.dependencies]
libghostty-vt = { path = "vendor/libghostty-rs/crates/libghostty-vt" }
portable-pty = "0.8"
thiserror = "2"
softbuffer = "0.4"
fontdb = "0.21"
fontdue = "0.9"
winit = "0.30"
toml = "0.8"
