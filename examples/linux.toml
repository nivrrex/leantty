# ==============================================================================
# Alacritty 配置文件 (极致鲜艳 + 高对比度版)
# 针对：解决浅色模式下蓝/绿色彩不鲜艳的问题
# ==============================================================================

[window]
position = { x = 50, y = 40 }
dimensions = { columns = 120, lines = 30 }
padding = { x = 0, y = 0 }
dynamic_title = true
opacity = 1.0

[scrolling]
history = 10000
multiplier = 10

[font]
size = 13.0
# 主字体：请选小体积的等宽西文字体（如 Consolas / DejaVu Sans Mono / JetBrains Mono）。
# 原因：主字体在启动时同步加载并解析（fontdue from_bytes），字体文件越大解析越慢，
#      直接拖慢首帧——实测 16MB 级 CJK 字体 from_bytes 约 230ms，0.3MB 等宽西文约 12ms。
# 大体积 CJK 字体放到 font.fallback：它在后台线程加载，不阻塞首帧，
#      到位前缺字显示占位方块，到位后自动重绘。
normal = { family = "Consolas", style = "Regular" }
bold = { family = "Consolas", style = "Bold" }
italic = { family = "Consolas", style = "Italic" }
bold_italic = { family = "Consolas", style = "Bold Italic" }
# CJK 回退链（按顺序尝试）。可用 fc-list :lang=zh 查看本机可用字体名。
fallback = [ { family = "黑体", style = "Regular" } ]

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

# --- [颜色设置：柔和浅色主题] ---
[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
# 微暖灰白，避免纯白背景
background = "#F3F1E9"
# 深灰文字，避免纯黑
foreground = "#303238"

[colors.cursor]
text = "#F3F1E9"
cursor = "#5579A8"

[colors.normal]
black   = "#303238"
red     = "#B94B4B"
green   = "#39804D"
yellow  = "#A87925"
blue    = "#3568A8"
magenta = "#98628D"
cyan    = "#398D91"
white   = "#85847D"

[colors.bright]
black   = "#77766F"
red     = "#D45B55"
green   = "#4C9660"
yellow  = "#BD913C"
blue    = "#527FBD"
magenta = "#AE78A1"
cyan    = "#54A5A4"
white   = "#E5E2D9"

# --- 鼠标与按键绑定 ---
[[mouse.bindings]]
mouse = "Middle"
action = "Copy"

[[mouse.bindings]]
mouse = "Right"
action = "Paste"

[[keyboard.bindings]]
key = "Insert"
mods = "Control"
action = "Copy"

[[keyboard.bindings]]
key = "Insert"
mods = "Shift"
action = "Paste"
